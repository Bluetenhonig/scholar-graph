name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every CI job replays recorded cassettes: no API key, no spend, no flakes.
  SCHOLAR_GRAPH_LLM_MODE: replay

jobs:
  quality:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra panel
      - name: ruff
        run: uv run ruff check src tests evals scripts
      - name: ruff format check
        run: uv run ruff format --check src tests evals scripts
      - name: mypy --strict
        run: uv run mypy src

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python }} --extra dev --extra panel
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing

  eval:
    name: eval gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra panel
      - name: Run evaluation suite
        # Exits non-zero if citation precision, groundedness, coverage or cost
        # crosses evals/thresholds.json. This is a gate, not a dashboard.
        run: uv run python evals/run_eval.py --out eval-report.md
      - name: Publish report to the job summary
        if: always()
        run: cat eval-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.md

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: scholar-graph:ci
